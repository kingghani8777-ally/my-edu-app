<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAI - Paper & Quiz Generator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        h1, h2 {
            margin-top: 0;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input[type="text"], input[type="password"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        #output {
            white-space: pre-wrap;
            line-height: 1.6;
            background: #f1f5f9;
            padding: 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .spinner {
            display: none;
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>EduAI - ٹیسٹ اور پیپر جنریٹر</h1>
        <p>اپنی Gemini API Key درج کریں اور سیکنڈوں میں پرچہ یا سوالات تیار کریں۔</p>
        
        <div class="form-group">
            <label for="apiKey">Gemini API Key:</label>
            <input type="password" id="apiKey" placeholder="AIzaSy... یہاں اپنی کی ڈالیں">
        </div>
    </div>

    <div class="card">
        <h2>پیپر کی تفصیلات</h2>
        
        <div class="form-group">
            <label for="subject">مضمون (Subject):</label>
            <input type="text" id="subject" placeholder="مثال: English, Physics, Urdu">
        </div>

        <div class="form-group">
            <label for="grade">کلاس (Grade/Class):</label>
            <input type="text" id="grade" placeholder="مثال: Class 9, Class 10, 5th Grade">
        </div>

        <div class="form-group">
            <label for="topic">ٹاپک یا چیپٹر (Topic/Chapter):</label>
            <input type="text" id="topic" placeholder="مثال: Chapter 1 - Introduction to Biology">
        </div>

        <div class="form-group">
            <label for="paperType">پرچے کی قسم:</label>
            <select id="paperType">
                <option value="mcqs">صرف کثیر الانتخابی سوالات (MCQs)</option>
                <option value="short">مختصر سوالات (Short Questions)</option>
                <option value="full">مکمل پیپر (MCQs + Short + Long Questions)</option>
            </select>
        </div>

        <button id="generateBtn" onclick="generatePaper()">پیپر تیار کریں</button>
        <div id="loading" class="spinner">پرچہ تیار ہو رہا ہے، براہ کرم انتظار کریں...</div>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <h2>تیار شدہ پرچہ:</h2>
        <div id="output"></div>
        <br>
        <button onclick="window.print()">پرچہ پرنٹ کریں / PDF میں سیو کریں</button>
    </div>
</div>

<script>
    async function generatePaper() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const subject = document.getElementById('subject').value.trim();
        const grade = document.getElementById('grade').value.trim();
        const topic = document.getElementById('topic').value.trim();
        const paperType = document.getElementById('paperType').value;

        if (!apiKey) {
            alert('براہِ کرم پہلے اپنی Gemini API Key درج کریں۔');
            return;
        }

        if (!subject || !topic) {
            alert('براہِ کرم مضمون اور ٹاپک کا نام درج کریں۔');
            return;
        }

        const btn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const resultCard = document.getElementById('resultCard');
        const output = document.getElementById('output');

        btn.disabled = true;
        loading.style.display = 'block';
        resultCard.style.display = 'none';

        const prompt = `Create an educational test/paper in Urdu & English (bilingual if applicable) based on the following details:
        - Subject: ${subject}
        - Class/Grade: ${grade}
        - Topic: ${topic}
        - Format Required: ${paperType}
        
        Make sure the format is clean, well-structured, professional, and ready for teachers to use in school.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: prompt }]
                    }]
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || 'کوئی ایرر آیا ہے، برائے مہربانی API Key چیک کریں۔');
            }

            const resultText = data.candidates[0].content.parts[0].text;
            output.innerText = resultText;
            resultCard.style.display = 'block';

        } catch (error) {
            alert('ایرر: ' + error.message);
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
        }
    }
</script>

</body>
</html>
